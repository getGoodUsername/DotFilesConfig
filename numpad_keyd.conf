[ids]

# 8bitdo Retro 18 Numpad
2dc8:5204
#---------------------------------------------------------------


[main]
kp0 = overload(main_group, kp0)
esc = overload(audio_ctl, esc)
kpdot = overload(window_nav, kpdot)

kpasterisk = timeout(kpasterisk, 250, macro(^))
#---------------------------------------------------------------


[audio_ctl]
kpslash = timeout(volumedown, 250,  macro2(500, 250, previoussong))
kpasterisk = timeout(volumeup, 250, macro2(500, 250, nextsong))
backspace = playpause
kpminus = rewind
kpplus = fastforward
#---------------------------------------------------------------


[main_group]
kp8 = up
kp4 = left
kp5 = down
kp6 = right
kpdot = tab

# web page nav
kpminus = C-pageup
kpplus = C-pagedown
esc = C-w

# calc shortcuts
kpslash = kpleftparen
kpasterisk = kprightparen
kp3 = %
kp1 = comma
kp2 = "
# " # extra comment so editor doesn't get confused with open "
#---------------------------------------------------------------


# NOTE:
# without :A (alt modifier) cant use alt tab switching fully
# :A allows continuous alt. Else auto modifier guard messes up
[window_nav:A]
kpplus = A-tab
kpminus = A-S-tab

# for consistency with main_group. kpdot + kp0 = tab
# without need for specific ordering
kp0 = tab

# noop added so the disable_modifier_guard
# doesn't interfere with linux mint finishing
# the window selection screen. Without the noop
# it doesn't work as expected
kpenter = macro(noop M-w noop)

# minimize window on tap, close window on with a repeat guard
# TIP: set different animation for minimize vs close
# so it is obvious what happened
backspace = timeout(A-f5, 250, macro2(5000, 5000, A-f4))
#---------------------------------------------------------------

