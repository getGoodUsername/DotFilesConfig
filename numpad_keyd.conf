[ids]

# 8bitdo Retro 18 Numpad
2dc8:5204
#---------------------------------------------------------------


[main]
esc = overload(audio_ctl, esc)
calc = toggle(nav)


kpasterisk = timeout(kpasterisk, 250, macro(kprightparen))
kpslash = timeout(kpslash, 250, macro(kpleftparen))
kpplus = timeout(kpplus, 250, macro(^))
kp0 = timeout(kp0, 250, macro(comma))
kpdot = timeout(kpdot, 250, macro(%))
kpenter = timeout(kpenter, 250, macro("))
# " # extra comment so editor doesn't get confused with open "

# vim. use with macro2 to slow down repeat.
# intended for quick specific selection; slower = better
# use nav mode with cal button for faster selection
kp7 = timeout(kp7, 250, macro2(250, 250, left))
kp8 = timeout(kp8, 250, macro2(250, 250, down))
kp9 = timeout(kp9, 250, macro2(250, 250, up))
kpminus = timeout(kpminus, 250, macro2(250, 250, right))
#---------------------------------------------------------------


[audio_ctl]
kpslash = timeout(volumedown, 250, macro(previoussong))
kpasterisk = timeout(volumeup, 250, macro(nextsong))
backspace = timeout(playpause, 250, macro(mute))
kpminus = rewind
kpplus = fastforward
#---------------------------------------------------------------


[nav]
kp8 = up
kp4 = left
kp5 = down
kp6 = right

kpminus = pageup
kpplus = pagedown
#---------------------------------------------------------------
