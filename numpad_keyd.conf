[ids]

# 8bitdo Retro 18 Numpad
2dc8:5204
#---------------------------------------------------------------


[main]
esc = overload(audio_ctl, esc)
kp0 = overload(calc_nav, kp0)
kpdot = timeout(kpdot, 200, layer(page_nav))

kpasterisk = timeout(kpasterisk, 250, macro(^))
#---------------------------------------------------------------


[audio_ctl]
kpslash = timeout(volumedown, 250,  macro2(500, 250, previoussong))
kpasterisk = timeout(volumeup, 250, macro2(500, 250, nextsong))
backspace = playpause
kpminus = rewind
kpplus = fastforward
#---------------------------------------------------------------


[calc_nav]
kp8 = up
kp4 = left
kp5 = down
kp6 = right
kpminus = C-pageup
kpplus = C-pagedown


esc = equal
kpslash = kpleftparen
kpasterisk = kprightparen
backspace = %
kp1 = comma
kp2 = "
# " # extra comment so editor doesn't get confused with open "
#---------------------------------------------------------------


[page_nav]
kpminus = pageup
kpplus = pagedown
#---------------------------------------------------------------
